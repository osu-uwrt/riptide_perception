#
# riptide_mapping configuration file.
#

# BOTH-ROBOTS SETTTINGS
/**/riptide_mapping2:
  ros__parameters:
    confidence_cutoff: 0.2

    # Map estimator (map_estimator.py). The init_data poses are a dead-reckoned layout; map objects sit at prior + offset + deviation
    estimator:
      offset_std_xy: 1.0 # m, where the course sits in odometry at the start
      offset_std_z: 0.3
      drift_var_per_m_xy: 0.002 # m^2 the offset can drift per m traveled
      drift_var_per_m_z: 0.0002
      drift_var_per_s_xy: 0.00001 # m^2 per s, even when holding still
      drift_var_per_s_z: 0.000001
      layout_std_xy: 0.25 # m, how far a map object can be from where the layout puts it...
      layout_std_z: 0.15
      layout_robust_scale: 2.0 # ...heavy-tailed: a prior this many stds off that disagrees with the other props is released
      course_yaw_std_deg: 2.0 # start-heading misalignment of the layout (the AprilTag calibration keeps it small; 0: off)
      fix_merge_distance: 1.0 # m; sightings of one object closer together than this merge into one fix
      child_std_xy: 0.5 # m, prior of an object in its parent mapping frame
      child_std_z: 0.3
      yaw_std_deg: 30.0
      gate_chi2: 16.27 # reject detections further than this (Mahalanobis^2, 3 dof 99.9 %)...
      yaw_gate_chi2: 10.83
      gate_min_updates: 10 # ...once the object has this many accepted detections
      gate_max_rejects: 30 # this many rejections in a row reacquires the object from its prior covariance
      # Until a target is confirmed its covariance stays at the old "not seen" values (error 1.73), so tree checks need
      # confirm_detections fresh detections while targeted, also when it was already known well (then the first
      # verify_detections must land where it was, widened by the drift since it was last seen)
      confirm_detections: 20
      verify_detections: 3
      # Once confirmed, the published covariance is never below the scatter of its last spread_window detections:
      # converged means the detections agree, as with the old mapping's buffer (the trees' thresholds were tuned on it)
      spread_window: 50
      # An object's first detections since a reset wait until acquire_detections agree (within acquire_radius_m, over
      # acquire_window_s) and its estimate starts from those only, so a stray false detection never moves or biases it.
      # Agreeing further than acquire_prior_chi2 from where the map expects it takes acquire_far_detections over
      # acquire_far_s: a lookalike off to the side has to keep agreeing longer to take over the prior. <= 1: off
      acquire_detections: 4
      acquire_radius_m: 0.3
      acquire_window_s: 4.0
      acquire_prior_chi2: 16.27
      acquire_far_detections: 12
      acquire_far_s: 2.0

    # Detection noise: std grows with range, across and (stereo depth) along the camera ray. From the old thresholds
    # (the holes' 0.0005 needed under ~2 cm of scatter at 1.5 m); measure the real scatter to tune
    noise:
      base_std: 0.01
      lateral_std_per_m: 0.003
      range_std_per_m: 0.008
      range_std_per_m2: 0.003
      timing_std: 0.25 # s, stamp error; smears detections while the vehicle turns or moves. The detector pairs each image
                       # with a depth frame typically 0.2-0.5 s older (measured on the Orin 2026-11-12)
      yaw_std_deg: 3.0
      correlation_time: 0.3 # s, detections closer together than this count for less
      max_inflation: 30.0
      # Seen at an angle (camera ray off the object's normal) a detection counts for less: position and yaw variance
      # times 1 / cos(angle)^obliquity_power, the angle capped at max_obliquity_deg. 0: off
      obliquity_power: 2.0
      max_obliquity_deg: 75.0

    # Published frames chase the estimate at most this fast (<= 0: jump); the lag left is added to the published covariance.
    # Off: the MPC already smooths frame motion (path.frame_speed for carried paths, its motion profile for setpoints)
    output:
      max_speed: 0.0
      max_yaw_rate_deg: 0.0

    # Cursed ah bin geometry fit thresholds
    bin_fit:
      residual_tol_m: 0.10 # max reprojection error of the two vinyls to accept a fit
      baseline_tol_m: 0.10 # |measured baseline - model baseline| for a bad detection or incorrect vinyl map
      min_baseline_m: 0.20 # model xy baseline floor, if the CAD geometry is wrong this will catch it (CAD min is ~0.52m)
      cov_floor_m2: 0.0025 # published bin position variance floor (~0.05m std)
      z_consistency_tol_m: 0.10 # if the two targets bin z disagree by more than this, use config z

